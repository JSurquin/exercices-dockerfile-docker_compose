  icu-minify: '>=4.9.2'
  fast-uri: '>=3.1.1'
  ip-address: '>=10.1.1'
  ws: '>=8.20.1'
  uuid: '>=11.1.1'
  qs: '>=6.15.2'
  flatted: '>=3.4.2'
