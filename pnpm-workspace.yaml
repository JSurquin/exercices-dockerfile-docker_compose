overrides:
  axios: '>=1.15.1'
  handlebars: '>=4.7.9'
  dompurify: '>=3.3.4'
  kysely: '>=0.28.12'
  defu: '>=6.1.5'
  basic-ftp: '>=5.2.2'
  follow-redirects: '>=1.15.12'
