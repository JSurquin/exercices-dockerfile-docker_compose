# Environnement de développement local (PostgreSQL application)
# Usage : pnpm run dev:setup  ou  docker compose up -d
#
# RAG (pgvector) reste sur docker-compose.rag.yml : pnpm run docker:rag:up

services:
  postgres:
    image: postgres:16-alpine
    container_name: moonskin-dev-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: moonskin
      POSTGRES_PASSWORD: moonskin_dev
      POSTGRES_DB: moonskin_dev
    volumes:
      - moonskin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moonskin -d moonskin_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  moonskin_postgres_data:
