services:
  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: moonskin-rag-db
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: moonskin_rag
      POSTGRES_PASSWORD: moonskin_rag_dev
      POSTGRES_DB: moonskin_rag
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
      - ./docker/rag/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moonskin_rag -d moonskin_rag']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rag_postgres_data:
