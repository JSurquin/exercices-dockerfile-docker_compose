[phases.install]
cmds = [
  "pnpm install --no-frozen-lockfile --prefer-offline=false"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "pnpm run build"
]

# Migrations Prisma au DÉMARRAGE du conteneur (pas au build) : le builder
# Docker n'a pas accès au réseau Docker de la DB, donc `prisma migrate
# deploy` plante en build avec P1001. Au runtime en revanche le container
# voit bien Postgres et applique les migrations en attente avant de
# lancer Next.js.
[start]
cmd = "npx prisma migrate deploy && pnpm run start"
