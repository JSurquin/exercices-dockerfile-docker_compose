# Dokploy / Nixpacks — MoonSkin production image
# Healthchecks: voir docs/deployment-dokploy.md (Swarm Settings, pas ici)

[phases.setup]
# curl = healthcheck Swarm ; chromium = exports PDF admin (Puppeteer)
aptPkgs = ["...", "curl", "chromium", "fonts-liberation", "fontconfig", "ca-certificates"]

[phases.install]
cmds = [
  "pnpm install --no-frozen-lockfile --prefer-offline=false"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "sh -c 'GIT_SHA=$(git rev-parse --short HEAD 2>/dev/null || printf %s \"${SOURCE_COMMIT:-unknown}\"); export GIT_SHA NEXT_PUBLIC_GIT_SHA=\"$GIT_SHA\"; pnpm run build'"
]

[variables]
NODE_ENV = "production"
PORT = "3000"
HOSTNAME = "0.0.0.0"
NIXPACKS_NODE_VERSION = "20"
NODE_OPTIONS = "--max-old-space-size=4096"
SHARP_IGNORE_GLOBAL_LIBVIPS = "1"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

# Migrations au DÉMARRAGE (pas au build) : le builder Docker n'a pas le réseau DB.
# Le tunnel ne doit router le trafic qu'après healthcheck OK — configurer Dokploy.
[start]
cmd = "sh scripts/docker-start.sh"
